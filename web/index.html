<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstraSec: immune system for AI applications</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234b3b9a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c93a73'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="15" fill="none" stroke="#4b3b9a" stroke-width="2" stroke-dasharray="3 3.2"/>
        <circle cx="17" cy="17" r="9" fill="#4b3b9a"/><circle cx="20" cy="14.5" r="3.4" fill="#c93a73"/>
      </svg>
      <div><b>AstraSec</b><small>Immune system for AI apps</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <button class="btn ghost small" data-action="simulate">Generate sample traffic</button>
      <span id="foot-status">Connecting…</span>
    </div>
  </aside>
  <main id="view" aria-live="polite"><p class="skeleton">Loading…</p></main>
</div>

<div class="drawer-back" id="drawer-back"><div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Request detail"></div></div>

<dialog id="keydlg">
  <h3>API key required</h3>
  <p class="muted small" style="margin:6px 0 14px">This server was started with ASTRASEC_API_KEY set. Enter the key to use the dashboard; it is kept for this browser tab only.</p>
  <input type="text" id="keyin" autocomplete="off" aria-label="API key">
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="keysave">Save key</button></div>
</dialog>

<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/app.js"></script>
<script src="/static/views.js"></script>
<script>route();</script>
</body>
</html>
